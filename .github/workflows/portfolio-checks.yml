name: Portfolio checks

on:
  push:
    branches: [main, "portfolio/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify vendored icons match the locked package
        run: |
          npm run vendor:icons
          git diff --exit-code -- assets/vendor
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Upload browser report and viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-checks
          path: |
            playwright-report/
            test-results/
          retention-days: 14
